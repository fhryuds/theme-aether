<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout (title = '搜索 - ' + ${site.title}, content = ~{::content})}">
<th:block th:fragment="content">

  <header class="page-head">
    <h1 class="page-head__title">搜索</h1>
  </header>

  <form class="search-form" th:action="@{${site.url} + '/search'}" method="get">
    <input class="search-form__input" type="text" name="keyword"
           placeholder="输入关键词搜索…"
           th:value="${keyword}" autocomplete="off"/>
  </form>

  <div class="post-list">
    <div class="post-grid post-grid--staggered"
         th:if="${keyword != null and keyword != '' and not #lists.isEmpty(posts.items)}">
      <th:block th:each="post, st : ${posts.items}">
        <th:block th:replace="~{common/post-item :: postItem (${post}, ${st.count})}"/>
      </th:block>
    </div>

    <div class="empty" th:if="${keyword != null and keyword != '' and #lists.isEmpty(posts.items)}">
      <div class="empty__icon">⌕</div>
      <p>没有找到相关文章。</p>
    </div>

    <!-- 分页 -->
    <nav class="pagination"
         th:if="${keyword != null and keyword != '' and (posts.hasPrevious() or posts.hasNext())}">
      <a class="pagination__btn" th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}">上一页</a>
      <span class="pagination__btn is-disabled" th:unless="${posts.hasPrevious()}">上一页</span>
      <span class="pagination__info" th:text="${posts.page} + ' / ' + ${posts.totalPages}">1 / 1</span>
      <a class="pagination__btn" th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}">下一页</a>
      <span class="pagination__btn is-disabled" th:unless="${posts.hasNext()}">下一页</span>
    </nav>
  </div>

</th:block>
</html>
