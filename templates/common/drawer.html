<th:block th:fragment="drawer" xmlns:th="http://www.thymeleaf.org">
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer"
         th:with="avatarImg=${theme.config?.basic?.author_avatar}, avatarUrl=${theme.config?.basic?.author_avatar_url}">
    <div class="drawer__profile">
      <img class="drawer__avatar"
           th:if="${not #strings.isEmpty(avatarImg)}"
           th:src="${avatarImg}" alt=""/>
      <img class="drawer__avatar"
           th:if="${#strings.isEmpty(avatarImg) and not #strings.isEmpty(avatarUrl)}"
           th:src="${avatarUrl}" alt=""/>
      <span class="profile-card__avatar--empty drawer__avatar"
           th:if="${#strings.isEmpty(avatarImg) and #strings.isEmpty(avatarUrl)}"
           th:text="${#strings.isEmpty(site.title) ? 'A' : #strings.substring(site.title, 0, 1)}">A</span>
      <div class="drawer__profile-text">
        <p class="drawer__name" th:text="${site.title}">站点名</p>
        <p class="drawer__bio"
           th:if="${theme.config?.basic?.author_bio}"
           th:text="${theme.config.basic.author_bio}">个人简介</p>
      </div>
    </div>
    <div class="nav__actions" style="justify-content: flex-end;">
      <button class="nav__icon-btn" id="drawer-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>
    <ul class="drawer__links">
      <li><a th:href="@{${site.url}}">首页</a></li>
      <li><a th:href="@{${site.url} + '/archives'}">归档</a></li>
      <li><a th:href="@{${site.url} + '/categories'}">分类</a></li>
      <li><a th:href="@{${site.url} + '/tags'}">标签</a></li>
      <li><a href="javascript:void(0)" data-search-open>搜索文章</a></li>
    </ul>
  </aside>
</th:block>
