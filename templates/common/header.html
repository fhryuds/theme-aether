<header class="site-header" th:fragment="header" xmlns:th="http://www.thymeleaf.org">
  <nav class="nav container" aria-label="主导航">
    <a class="nav__brand" th:href="@{${site.url}}"
       th:with="avatarImg=${theme.config?.basic?.author_avatar}, avatarUrl=${theme.config?.basic?.author_avatar_url}">
      <img class="logo" th:if="${not #strings.isEmpty(avatarImg)}"
           th:src="${avatarImg}" alt=""/>
      <img class="logo" th:if="${#strings.isEmpty(avatarImg) and not #strings.isEmpty(avatarUrl)}"
           th:src="${avatarUrl}" alt=""/>
      <img class="logo" th:if="${#strings.isEmpty(avatarImg) and #strings.isEmpty(avatarUrl) and not #strings.isEmpty(site.logo)}"
           th:src="@{${site.logo}}" alt=""/>
      <span class="logo--text"
            th:if="${#strings.isEmpty(avatarImg) and #strings.isEmpty(avatarUrl) and #strings.isEmpty(site.logo)}"
            th:text="${#strings.isEmpty(site.title) ? 'A' : #strings.substring(site.title, 0, 1)}">A</span>
      <span th:text="${site.title}">Site</span>
    </a>

    <ul class="nav__links">
      <li><a th:href="@{${site.url}}">首页</a></li>
      <li><a th:href="@{${site.url} + '/archives'}">归档</a></li>
      <li><a th:href="@{${site.url} + '/categories'}">分类</a></li>
      <li><a th:href="@{${site.url} + '/tags'}">标签</a></li>
    </ul>

    <div class="nav__actions">
      <button class="nav__icon-btn" id="search-open" type="button" aria-label="搜索文章" title="搜索（Ctrl / ⌘ + K）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20.5 20.5-4.2-4.2"/>
        </svg>
      </button>
      <button class="nav__icon-btn" id="theme-toggle" type="button" aria-label="切换主题">
        <!-- 太阳（浅色模式时显示） -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <!-- 月亮（深色模式时显示） -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="nav__icon-btn nav__toggle" id="drawer-toggle" type="button" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
</header>
