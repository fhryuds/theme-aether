<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:fragment="html (head, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} != null ? ${title} : ${site.title}">站点标题</title>
  <th:block th:if="${description} != null">
    <meta name="description" th:attr="content=${description}"/>
  </th:block>
  <link rel="stylesheet" th:href="@{/assets/css/style.css?v={version}(version=${theme.spec.version})}"/>
  <script>
    /* 防闪烁：在 CSS 加载前根据 localStorage 或系统偏好设置主题 */
    (function () {
      var t = localStorage.getItem("aether-theme");
      if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <th:block th:if="${site.logo} != null and ${site.logo} != ''">
    <link rel="icon" th:href="@{${site.logo}}"/>
  </th:block>
  <th:block th:replace="${head}"/>
</head>
<body>
  <th:block th:replace="~{common/header :: header}"/>

  <main>
    <th:block th:insert="${content}"/>
  </main>

  <th:block th:replace="~{common/footer :: footer}"/>

  <th:block th:replace="~{common/drawer :: drawer}"/>

  <th:block th:replace="~{common/search :: search}"/>

  <script th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
</body>
</html>
